# .github/workflows/build-armbian-rk3588-kernel.yml
name: Build Armbian RK3588 Kernel (MPTCP, BBR, Docker)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "内核分支"
        required: true
        default: "current"
        type: choice
        options:
          - current
          - vendor
          - edge
      board:
        description: "目标板子 (Armbian BOARD 名称，如 rock-5b, orangepi5)"
        required: true
        default: "rock-5b"
        type: string
      release:
        description: "发行版"
        required: true
        default: "trixie"
        type: choice
        options:
          - noble
          - trixie
          - resolute

permissions:
  contents: write

env:
  BUILD_REPO: armbian/build
  KERNEL_CONFIG_FRAGMENT_FILE: linux-${{ inputs.board }}-${{ inputs.kernel_branch }}.config

jobs:
  build-kernel:
    name: 编译内核 (${{ inputs.board }} - ${{ inputs.kernel_branch }})
    runs-on: ubuntu-24.04-arm
    steps:
      - name: 安装基础依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget

      - name: 检出当前仓库
        uses: actions/checkout@v4

      - name: 检出 armbian/build
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BUILD_REPO }}
          path: build

      - name: 编译内核（禁用缓存，强制源码构建）
        run: |
          mkdir -p build/userpatches
          cat userpatches/comm.config > build/userpatches/linux-rockchip64-current.config
          cat userpatches/comm.config > build/userpatches/linux-rockchip64-edge.config
          cat userpatches/comm.config > build/userpatches/linux-seeed-rk3588-vendor.config
          cat userpatches/comm.config > build/userpatches/linux-rockchip-rk3588-edge.config
          cat userpatches/comm.config > build/userpatches/linux-rockchip-rk3588-current.config

          cd build

          # 核心修复：直接将你的自定义配置追加到 Armbian 默认的配置文件末尾
          # Linux 内核编译(make defconfig)的特性是：文件末尾的配置优先级最高，会覆盖前面的设置
          # cat userpatches/${{ env.KERNEL_CONFIG_FRAGMENT_FILE }} >> config/kernel/linux-rockchip64-${{ inputs.kernel_branch }}.config

          # 验证是否成功追加
          # echo "==== 检查合并后的配置文件 ===="
          # tail -n 30 config/kernel/linux-rockchip64-${{ inputs.kernel_branch }}.config

          sudo ./compile.sh kernel \
            BOARD=${{ inputs.board }} \
            BRANCH=${{ inputs.kernel_branch }} \
            RELEASE=${{ inputs.release }} \
            KERNEL_CONFIGURE=no \
            ARTIFACT_IGNORE_CACHE=yes \
            IGNORE_UPDATES=yes \
            CLEAN_LEVEL="make,debs"

      - name: 收集 deb 包
        run: |
          echo "寻找内核 deb 包..."
          find ${{ github.workspace }}/build/output/debs/ -name 'linux-*.deb' -ls
          mkdir -p ${{ github.workspace }}/artifacts
          cp ${{ github.workspace }}/build/output/debs/linux-*.deb ${{ github.workspace }}/artifacts/ || \
            echo "::warning:: 未找到内核 deb 包，请检查编译日志"

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ inputs.kernel_branch }}-${{ github.run_id }}-${{ github.run_attempt }}
          name: "Armbian RK3588 内核 (${{ inputs.board }}, ${{ inputs.kernel_branch }})"
          body: |
            - 板子: ${{ inputs.board }}
            - 内核分支: ${{ inputs.kernel_branch }}
            - 安装: `dpkg -i linux-image-*.deb linux-headers-*.deb`
            - apt --fix-broken install
            - update-initramfs -c -k $(uname -r)
            - armbian-install (更新 bl)
          files: |
            ${{ github.workspace }}/artifacts/linux-*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 保留 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: armbian-rk3588-kernel-${{ inputs.board }}-${{ inputs.kernel_branch }}
          path: ${{ github.workspace }}/artifacts/
