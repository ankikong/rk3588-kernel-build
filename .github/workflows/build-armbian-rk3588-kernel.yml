# .github/workflows/build-armbian-rk3588-kernel.yml
name: Build Armbian RK3588 Kernel (MPTCP, BBR, Docker)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: '内核分支'
        required: true
        default: 'current'
        type: choice
        options:
          - current
          - vendor
          - edge
      board:
        description: '目标板子 (Armbian BOARD 名称，如 rock-5b, orangepi5)'
        required: true
        default: 'rock-5b'
        type: string
      release:
        description: '发行版基 (仅用于跳过交互)'
        required: true
        default: 'trixie'
        type: choice
        options:
          - noble
          - trixie
          - resolute

permissions:
  contents: write

env:
  BUILD_REPO: armbian/build
  KERNEL_CONFIG_FRAGMENT_FILE: linux-${{ inputs.board }}-${{ inputs.kernel_branch }}.config

jobs:
  build-kernel:
    name: 编译内核 (${{ inputs.board }} - ${{ inputs.kernel_branch }})
    runs-on: ubuntu-24.04-arm
    steps:
      - name: 安装基础依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget

      - name: 检出 armbian/build
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BUILD_REPO }}
          path: build

      - name: 创建内核配置片段 (MPTCP + IPv6 + BBR + Docker)
        run: |
          mkdir -p build/userpatches
          cat > build/userpatches/${{ env.KERNEL_CONFIG_FRAGMENT_FILE }} << 'EOF'
          CONFIG_IPV6=y
          CONFIG_MPTCP=y
          CONFIG_MPTCP_IPV6=y
          CONFIG_MPTCP_PM_ADVANCED=y
          CONFIG_MPTCP_FULLMESH=y
          CONFIG_MPTCP_NDIFFPORTS=y
          CONFIG_MPTCP_BINDER=y
          CONFIG_MPTCP_NETLINK=y
          CONFIG_MPTCP_SCHED_ADVANCED=y
          CONFIG_MPTCP_BLEST=y
          CONFIG_MPTCP_ROUNDROBIN=y
          CONFIG_MPTCP_ECF=y
          CONFIG_INET_MPTCP_DIAG=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_CPU=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_MEMORY=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_HUGETLB=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_CGROUP_PERF=y
          CONFIG_CGROUP_BPF=y
          CONFIG_NAMESPACES=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y
          CONFIG_PID_NS=y
          CONFIG_NET_NS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_BRIDGE=y
          CONFIG_NETFILTER_XTABLES=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP6_NF_IPTABLES=y
          CONFIG_IP_NF_NAT=y
          CONFIG_NF_NAT=y
          CONFIG_VETH=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_IP_VS=y
          EOF

      - name: 编译内核（禁用缓存，强制源码构建）
        run: |
          cd build
          sudo ./compile.sh kernel \
            BOARD=${{ inputs.board }} \
            BRANCH=${{ inputs.kernel_branch }} \
            RELEASE=${{ inputs.release }} \
            KERNEL_CONFIGURE=no \
            ARTIFACT_USE_CACHE=no \
            KERNEL_CONFIG_FRAGMENTS="userpatches/${{ env.KERNEL_CONFIG_FRAGMENT_FILE }}"

      - name: 收集 deb 包
        run: |
          echo "寻找内核 deb 包..."
          find ${{ github.workspace }}/build/output/debs/ -name 'linux-*.deb' -ls
          mkdir -p ${{ github.workspace }}/artifacts
          cp ${{ github.workspace }}/build/output/debs/linux-*.deb ${{ github.workspace }}/artifacts/ || \
            echo "::warning:: 未找到内核 deb 包，请检查编译日志"

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ inputs.kernel_branch }}-${{ github.run_id }}-${{ github.run_attempt }}
          name: "Armbian RK3588 内核 (${{ inputs.board }}, ${{ inputs.kernel_branch }})"
          body: |
            - 源码编译（非缓存），已启用:
            - MPTCP 全部功能 (含 IPv6)、BBR、Docker 完整支持
            - 板子: ${{ inputs.board }}
            - 内核分支: ${{ inputs.kernel_branch }}
            - 安装: `dpkg -i linux-image-*.deb linux-headers-*.deb`
          files: |
            ${{ github.workspace }}/artifacts/linux-*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 保留 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: armbian-rk3588-kernel-${{ inputs.board }}-${{ inputs.kernel_branch }}
          path: ${{ github.workspace }}/artifacts/