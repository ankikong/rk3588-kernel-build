# .github/workflows/build-armbian-rk3588-kernel-optimized.yml
name: Build Armbian RK3588 Kernel (via armbian/build)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: '内核分支 (对应 Armbian 的 BRANCH)'
        required: true
        default: 'current'
        type: choice
        options:
          - current
          - vendor
      board:
        description: '目标板子 (Armbian BOARD 名称，例如 rock-5b, orangepi5, nanopi-r5s)'
        required: true
        default: 'rock-5b'
        type: string
      release:
        description: '发行版基 (仅用于跳过交互，不影响内核配置)'
        required: true
        default: 'noble'
        type: choice
        options:
          - noble
          - trixie
          - resolute

env:
  BUILD_REPO: armbian/build
  KERNEL_CONFIG_FRAGMENT_FILE: kernel-mptcp-bbr-docker.config

jobs:
  build-kernel:
    name: 编译内核 (${{ inputs.board }} - ${{ inputs.kernel_branch }})
    runs-on: ubuntu-24.04-arm
    steps:
      - name: 安装基础依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget

      - name: 检出 armbian/build
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BUILD_REPO }}
          path: build

      - name: 创建内核配置片段 (MPTCP + IPv6 + BBR + Docker)
        run: |
          mkdir -p build/userpatches
          cat > build/userpatches/${{ env.KERNEL_CONFIG_FRAGMENT_FILE }} << 'EOF'
          # IPv6 基础
          CONFIG_IPV6=y

          # MPTCP 全部功能 (含 IPv6)
          CONFIG_MPTCP=y
          CONFIG_MPTCP_IPV6=y
          CONFIG_MPTCP_PM_ADVANCED=y
          CONFIG_MPTCP_FULLMESH=y
          CONFIG_MPTCP_NDIFFPORTS=y
          CONFIG_MPTCP_BINDER=y
          CONFIG_MPTCP_NETLINK=y
          CONFIG_MPTCP_SCHED_ADVANCED=y
          CONFIG_MPTCP_BLEST=y
          CONFIG_MPTCP_ROUNDROBIN=y
          CONFIG_MPTCP_ECF=y
          CONFIG_INET_MPTCP_DIAG=y

          # BBR
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"

          EOF

      - name: 创建 Armbian 用户配置文件
        run: |
          cat > build/userpatches/config-${{ env.CONFIG_NAME }}.conf << CONFEOF
          BOARD=${{ inputs.board }}
          BRANCH=${{ inputs.kernel_branch }}
          KERNEL_ONLY=yes
          KERNEL_CONFIGURE=no
          KERNEL_CONFIG_FRAGMENTS="userpatches/${{ env.KERNEL_CONFIG_FRAGMENT_FILE }}"
          CONFEOF

      - name: 运行 Armbian 内核构建
        run: |
          cd build
          sudo ./compile.sh \
            BOARD=${{ inputs.board }} \
            BRANCH=${{ inputs.kernel_branch }} \
            RELEASE=${{ inputs.release }} \
            KERNEL_ONLY=yes \
            KERNEL_CONFIGURE=no \
            KERNEL_CONFIG_FRAGMENTS="userpatches/${{ env.KERNEL_CONFIG_FRAGMENT_FILE }}"

      - name: 收集内核 deb 包
        run: |
          echo "生成的 deb 文件："
          find ${{ github.workspace }}/build/output/debs/ -name 'linux-*.deb' -ls
          cp ${{ github.workspace }}/build/output/debs/linux-*.deb ${{ github.workspace }}/

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ inputs.kernel_branch }}-${{ github.run_id }}-${{ github.run_attempt }}
          name: "Armbian RK3588 内核 (${{ inputs.board }}, ${{ inputs.kernel_branch }})"
          body: |
            - 使用 armbian/build 编译
            - 板子: ${{ inputs.board }}
            - 内核分支: ${{ inputs.kernel_branch }}
            - 发行版基: ${{ inputs.release }}
            - 已启用: MPTCP 全部功能 (含 IPv6)、BBR、Docker 支持
            - 仅内核 deb 包，安装命令：`dpkg -i linux-image-*.deb linux-headers-*.deb`
          files: |
            ${{ github.workspace }}/linux-*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 保留编译产物 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: armbian-rk3588-kernel-${{ inputs.board }}-${{ inputs.kernel_branch }}
          path: ${{ github.workspace }}/linux-*.deb