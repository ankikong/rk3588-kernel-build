name: Build Custom Ubuntu Generic Kernel

on:
  workflow_dispatch:
    inputs:
      ubuntu_version:
        description: 'Select Target Ubuntu Version (Runner)'
        required: true
        default: 'ubuntu-24.04'
        type: choice
        options:
          - ubuntu-24.04
          - ubuntu-22.04
          - ubuntu-20.04

jobs:
  build-kernel:
    runs-on: ${{ github.event.inputs.ubuntu_version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. 释放磁盘空间
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      # 2. 启用 Source 源码源并更新包缓存
      - name: Enable Source Repositories
        run: |
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            # 适用于 Ubuntu 24.04+ (DEB822 格式)
            sudo sed -i 's/Types: deb/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          else
            # 适用于 Ubuntu 22.04 及更早版本 (传统格式)
            sudo sed -i 's/# deb-src/deb-src/g' /etc/apt/sources.list
          fi
          sudo apt-get update

      # 3. 动态解析最新 linux-image-generic 的依赖，并拉取真正的未签名内核源码包
      - name: Fetch Kernel Source via APT
        run: |
          # 提取当前仓库中最新 linux-image-generic 依赖的具体内核二进制包名
          KERNEL_DEP=$(apt-cache depends linux-image-generic | grep -o 'linux-image-[0-9]\+.*-generic' | head -n 1)
          
          if [ -z "$KERNEL_DEP" ]; then
            echo "警告：无法通过依赖关系提取具体内核包，回退到拉取默认的 linux 源码包"
            KERNEL_DEP="linux"
          else
            # 将已签名的包名转为 unsigned 的包名，确保拉取真实的 linux 源码包
            KERNEL_DEP=$(echo "$KERNEL_DEP" | sed 's/linux-image-\([0-9]\)/linux-image-unsigned-\1/')
            echo "最新 generic 内核指向的真实源码包为: $KERNEL_DEP"
          fi
          
          # 直接下载对应的未签名内核源码包并自动解压
          apt-get source "$KERNEL_DEP" || apt-get source linux
          
          # 定位解压出的源码目录并重命名统一管理
          SRC_DIR=$(find . -maxdepth 1 -type d -name "linux-*" | head -n 1)
          if [ -z "$SRC_DIR" ]; then
            echo "错误：未能成功获取到解压后的内核源码"
            exit 1
          fi
          echo "成功定位源码路径: $SRC_DIR"
          mv "$SRC_DIR" kernel-source

      # 4. 基于未签名的真实内核包拉取编译依赖
      - name: Install Build Dependencies
        run: |
          KERNEL_DEP=$(apt-cache depends linux-image-generic | grep -o 'linux-image-[0-9]\+.*-generic' | head -n 1)
          if [ -n "$KERNEL_DEP" ]; then
            KERNEL_UNSIGNED_DEP=$(echo "$KERNEL_DEP" | sed 's/linux-image-\([0-9]\)/linux-image-unsigned-\1/')
            sudo apt-get build-dep -y "$KERNEL_UNSIGNED_DEP" || true
          fi
          sudo apt-get build-dep -y linux || true
          
          # 补充必装编译工具
          sudo apt-get install -y \
            fakeroot \
            build-essential \
            libncurses-dev \
            gawk \
            flex \
            bison \
            openssl \
            libssl-dev \
            dkms \
            libelf-dev \
            libudev-dev \
            libpci-dev \
            libiberty-dev \
            autoconf \
            llvm \
            dwarves \
            zstd \
            rsync \
            debhelper \
            dpkg-dev \
            bc

      # 5. 限制构建架构、重写 annotations 头部字段并注入配置
      - name: Configure Kernel Options
        working-directory: kernel-source
        run: |
          chmod a+x debian/rules
          chmod a+x debian/scripts/* 2>/dev/null || true
          chmod a+x debian/scripts/misc/* 2>/dev/null || true

          # 修改编译版本后缀，避免与系统原生内核冲突
          # sed -i 's/)/+custom-config)/' debian.master/changelog
          cat ../userpatches/comm.config >> custom.config

          # 限制只针对 amd64 生成配置
          for config_path in debian.master/etc/kernelconfig debian/etc/kernelconfig; do
            if [ -f "$config_path" ]; then
              echo "正在修改 $config_path，设定 archs=amd64 ..."
              echo 'archs="amd64"' > "$config_path"
            fi
          done

          # ================== 核心修复：重写 annotations 头部字段 ==================
          # 强行将单行空格分隔的多架构声明重写为只保留 amd64 极简声明。
          # 这样可以从根本上阻止 kernelconfig 脚本循环非 native 架构并报缺交叉编译器的错误。
          for anno_path in debian.master/config/annotations debian/config/annotations; do
            if [ -f "$anno_path" ]; then
              echo "正在重写 $anno_path 的 ARCH 与 FLAVOUR 声明..."
              sed -i 's/^# ARCH: .*/# ARCH: amd64/' "$anno_path"
              sed -i 's/^# FLAVOUR: .*/# FLAVOUR: amd64-generic/' "$anno_path"
            fi
          done
          # =========================================================================

          if [ -f ../custom.config ]; then
            echo "解析 custom.config 中..."
            while IFS='=' read -r key value || [ -n "$key" ]; do
              key=$(echo "$key" | xargs)
              value=$(echo "$value" | xargs)
              value=$(echo "$value" | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")

              if [[ -z "$key" || "$key" =~ ^# ]]; then
                continue
              fi

              # 如果存在 annotations 脚本（新版 Ubuntu），则使用官方脚本注入
              if [ -f ./debian/scripts/misc/annotations ]; then
                echo "[Annotations] 注入: $key = $value"
                ./debian/scripts/misc/annotations --arch amd64 --flavour generic --config "$key" --write "$value" --note "Custom config"
              else
                # 否则（旧版 Ubuntu），直接修改对应的底层模板配置文件
                CONFIG_FILE=""
                if [ -f debian.master/config/amd64/config.flavour.generic ]; then
                  CONFIG_FILE="debian.master/config/amd64/config.flavour.generic"
                elif [ -f debian/config/amd64/config.flavour.generic ]; then
                  CONFIG_FILE="debian/config/amd64/config.flavour.generic"
                fi
                
                if [ -n "$CONFIG_FILE" ]; then
                  echo "[Config Template] 注入 $CONFIG_FILE: $key = $value"
                  sed -i "/$key/d" "$CONFIG_FILE"
                  echo "$key=$value" >> "$CONFIG_FILE"
                else
                  echo "警告：无法定位内核配置模板文件，请检查源码目录结构。"
                fi
              fi
            done < ../custom.config
          else
            echo "错误：未在仓库根目录找到 custom.config 文件！"
            exit 1
          fi

          # 重新编译配置文件，配合 do_skip_checks=true 绕过静态验证
          fakeroot debian/rules clean
          fakeroot debian/rules genconfigs do_skip_checks=true

      # 6. 编译内核二进制包
      - name: Build Kernel Packages
        working-directory: kernel-source
        run: |
          export CONCURRENCY_LEVEL=$(nproc)
          # 显式加入 do_skip_checks=true 以绕过静态完整性检查
          fakeroot debian/rules binary-headers binary-generic binary-perarch skipabi=true skipmodule=true skipdbg=true do_skip_checks=true

      # 7. 精确提取 headers, image, modules 产物
      - name: Collect Debian Packages
        run: |
          mkdir -p output
          mv ../linux-headers-*.deb output/ 2>/dev/null || true
          mv ../linux-image-unsigned-*.deb output/ 2>/dev/null || true
          mv ../linux-image-*.deb output/ 2>/dev/null || true
          mv ../linux-modules-*.deb output/ 2>/dev/null || true
          echo "==== 已收集的目标安装包 ===="
          ls -lh output/

      # 8. 上传构建结果
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.ubuntu_version }}-kernel-debs
          path: output/*.deb